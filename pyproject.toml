[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-domain-fusion"
version = "0.1.0"
description = "Source-preserving narrative planning domain compilation and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "unified-planning==1.3.0",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
fusion = [
    "sentence-transformers==5.7.0",
    "requests>=2.32.0",
    "numpy",
]
heuristic = [
    "up-pyperplan==1.1.0",
    "pyperplan==2.1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = [
    "rcnc", "unidomain", "prompts", "scripts", "scripts.*",
    "archive", "archive.rcnc", "archive.scripts", "archive.scripts.*",
    "archive.entrypoints",
]
namespaces = false

[tool.setuptools.package-data]
prompts = ["narrafuse/*/*.txt", "unidomain/*.txt"]
